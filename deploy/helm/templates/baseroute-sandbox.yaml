---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-sandbox
  annotations:
    ai.epicgames.com/allowed-emails: {{ .Values.substrateSandbox.allowedEmails | join "," | quote }}
spec:
  parentRefs:
    - name: sandbox-gateway
      namespace: envoy-gateway-system
  hostnames:
    - "sandbox.{{ .Values.gatewayDomain }}.internal.epicgames.net"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ .Release.Name }}
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /{{ .Release.Name }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  annotations:
    ai.epicgames.com/allowed-emails: {{ .Values.substrateSandbox.allowedEmails | join "," | quote }}
spec:
  parentRefs:
    - name: sandbox-gateway
      namespace: envoy-gateway-system
  hostnames:
    - "{{ .Release.Name }}.{{ .Values.gatewayDomain }}.internal.epicgames.net"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ .Release.Name }}
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
